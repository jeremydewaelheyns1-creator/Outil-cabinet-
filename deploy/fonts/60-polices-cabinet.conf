  <alias binding="same"><family>Century Gothic</family><prefer><family>URW Gothic</family></prefer></alias>
  <alias binding="same"><family>Book Antiqua</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Palatino Linotype</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Palatino</family><prefer><family>P052</family></prefer></alias>
  <alias binding="same"><family>Century Schoolbook</family><prefer><family>C059</family></prefer></alias>
  <alias binding="same"><family>Century</family><prefer><family>C059</family></prefer></alias>
  <alias binding="same"><family>New Century Schoolbook</family><prefer><family>C059</family></prefer></alias>
