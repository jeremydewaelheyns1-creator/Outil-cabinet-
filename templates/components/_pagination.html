{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}
    <a class="button button-secondary button-small" href="?{% querystring page=page.previous_page_number %}">← Précédent</a>
  {% endif %}
  <span class="muted small">Page {{ page.number }} sur {{ page.paginator.num_pages }} · {{ page.paginator.count }} résultat{{ page.paginator.count|pluralize }}</span>
  {% if page.has_next %}
    <a class="button button-secondary button-small" href="?{% querystring page=page.next_page_number %}">Suivant →</a>
  {% endif %}
</nav>
{% endif %}
