# Site d'essai (D-130) : chaque modification qui passe les vérifications y arrive toute seule.
# Données fictives uniquement. Rien ne touche au vrai site ici.
name: Site d'essai

on:
  workflow_run:
    workflows: ["Vérifications"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write  # autorisation Google sans clé stockée (fédération d'identité)

concurrency:
  group: site-essai
  cancel-in-progress: false

env:
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/outil/application

jobs:
  essai:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Accès au dépôt d'images
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image (les parties qui ne changent pas sont réutilisées)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Base du site d'essai
        run: |
          IMG="${IMAGE}:${{ github.event.workflow_run.head_sha }}"
          gcloud run jobs update outil-essai-migrations --region="$REGION" --image="$IMG" --quiet
          gcloud run jobs execute outil-essai-migrations --region="$REGION" --wait --quiet
      - name: Mise en ligne du site d'essai
        run: |
          IMG="${IMAGE}:${{ github.event.workflow_run.head_sha }}"
          gcloud run services update outil-essai --region="$REGION" --image="$IMG" --quiet
          echo "### Site d'essai à jour" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
